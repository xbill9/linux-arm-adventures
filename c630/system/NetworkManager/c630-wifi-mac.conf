# The C630 WCN3990 has no MAC in the DT, so ath10k picks a random one every boot.
# Use a stable per-network MAC instead: captive portals (Starbucks etc.) remember
# the laptop across reboots, and networks still cannot link it to one another.
[connection-c630-wifi-mac]
match-device=interface-name:wlan0
wifi.cloned-mac-address=stable
