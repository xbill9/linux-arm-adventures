# Galaxy Book Go: the speaker amp on tertiary MI2S plays 16-bit stereo and
# stays silent with the 8-channel S24_LE stream PipeWire picks by default.
# Install to /etc/wireplumber/wireplumber.conf.d/, restart wireplumber.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = { update-props = { device.profile = "pro-audio" } }
  }
  {
    matches = [ { node.name = "alsa_output.platform-sound.pro-output-0" } ]
    actions = {
      update-props = {
        node.description = "Speakers"
        audio.format = "S16LE"
        audio.channels = 2
        audio.position = [ FL, FR ]
      }
    }
  }
]
