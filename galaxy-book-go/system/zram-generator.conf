# Galaxy Book Go: compressed swap in RAM, used before the disk swap partition.
# The machine has 3.4 GiB usable; a browser plus GNOME pushed 2 GiB into the
# disk swap on 2026-10-12. Sized at the full RAM because zstd typically
# compresses memory pages about 3:1, so the device uses far less than its size.
# Install: /etc/systemd/zram-generator.conf (needs systemd-zram-generator), then
#   sudo systemctl daemon-reload && sudo systemctl restart systemd-zram-setup@zram0
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
